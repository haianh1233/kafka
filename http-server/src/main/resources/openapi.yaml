openapi: "3.0.3"

info:
  title: Apache Kafka HTTP API
  version: "1.0.0"
  description: |
    Native HTTP protocol for Apache Kafka brokers. Enables produce, consume,
    and metadata operations over HTTP/1.1 without the Kafka binary protocol.

servers:
  - url: "http://{host}:{port}/v1"
    description: Kafka broker HTTP listener
    variables:
      host:
        default: "localhost"
      port:
        default: "9094"

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Broker health check
      description: Returns 200 if the broker is in RUNNING state, 503 otherwise.
      tags: [Health]
      responses:
        "200":
          description: Broker is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Broker is not healthy

  /topics:
    get:
      operationId: listTopics
      summary: List all topics
      description: Returns topic names the caller is authorized to see.
      tags: [Metadata]
      responses:
        "200":
          description: Topic list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicList"
        "403":
          $ref: "#/components/responses/Forbidden"

  /topics/{topic}:
    get:
      operationId: getTopicMetadata
      summary: Get topic metadata
      description: Returns partition, leader, replica, and ISR metadata for a topic.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/TopicName"
      responses:
        "200":
          description: Topic metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicMetadata"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"

  /topics/{topic}/records:
    post:
      operationId: produceRecords
      summary: Produce records to a topic
      description: |
        Send one or more records to a topic. Records may target different partitions.
        The broker forwards internally to partition leaders.
      tags: [Produce]
      parameters:
        - $ref: "#/components/parameters/TopicName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProduceRequest"
      responses:
        "200":
          description: All records produced successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProduceResponse"
        "207":
          description: Partial success (multi-partition batch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProduceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /topics/{topic}/records:fetch:
    post:
      operationId: fetchRecords
      summary: Consume records from a topic
      description: |
        Fetch records from specified partitions at given offsets.
        Uses POST because the fetch request carries per-partition offset state.
      tags: [Consume]
      parameters:
        - $ref: "#/components/parameters/TopicName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchRequest"
      responses:
        "200":
          description: Fetch results
          headers:
            X-Kafka-MaxWait-Applied:
              description: The effective maxWaitMs after server-side capping
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /topics/{topic}/partitions/{partition}/offsets:
    get:
      operationId: listOffsets
      summary: Get offset for a partition
      description: Returns the offset for a partition at a given timestamp.
      tags: [Metadata]
      parameters:
        - $ref: "#/components/parameters/TopicName"
        - $ref: "#/components/parameters/PartitionId"
        - name: timestamp
          in: query
          required: true
          description: |
            Timestamp to look up. Symbolic values: "earliest", "latest", "max".
            Or an epoch millisecond value.
          schema:
            type: string
      responses:
        "200":
          description: Offset info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OffsetInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /consumer-groups/{group}/lags:
    get:
      operationId: getConsumerGroupLag
      summary: Get consumer group lag
      description: |
        Returns committed offset, log-end offset, and lag per partition.
        Lag is approximate due to concurrent sampling.
      tags: [Consumer Groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Lag information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerGroupLag"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /consumer-groups/{group}/offsets:
    post:
      operationId: commitOffsets
      summary: Commit consumer group offsets
      description: |
        Store committed offsets in __consumer_offsets without joining the group.
        Uses generationId=-1 (simple consumer mode).
      tags: [Consumer Groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OffsetCommitRequest"
      responses:
        "200":
          description: Offsets committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OffsetCommitResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: fetchOffsets
      summary: Fetch committed offsets
      description: Returns committed offsets for the consumer group.
      tags: [Consumer Groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: topic
          in: query
          required: false
          description: Filter by topic name. Omit to get all topics.
          schema:
            type: string
      responses:
        "200":
          description: Committed offsets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OffsetFetchResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /share-groups/{group}/records:
    post:
      operationId: shareGroupPoll
      summary: Poll records from a share group (Phase 4)
      tags: [Share Groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareFetchRequest"
      responses:
        "200":
          description: Fetched records with acquire IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareFetchResponse"

  /share-groups/{group}/acknowledge:
    post:
      operationId: shareGroupAcknowledge
      summary: Acknowledge share group records (Phase 4)
      tags: [Share Groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareAcknowledgeRequest"
      responses:
        "200":
          description: Acknowledgements processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareAcknowledgeResponse"

components:
  parameters:
    TopicName:
      name: topic
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9._-]+$"
        maxLength: 249
    PartitionId:
      name: partition
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    GroupId:
      name: group
      in: path
      required: true
      schema:
        type: string
        maxLength: 255

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authorization failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request body too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: integer
        errorMessage:
          type: string
        detail:
          type: string
      required: [errorCode, errorMessage]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [RUNNING, NOT_RUNNING, STARTING, RECOVERY, PENDING_CONTROLLED_SHUTDOWN, SHUTTING_DOWN]
        brokerId:
          type: integer
        clusterId:
          type: string
      required: [status, brokerId, clusterId]

    DataObject:
      type: object
      properties:
        type:
          type: string
          enum: [STRING, BINARY, JSON, "NULL"]
        data:
          description: The data payload. String for STRING/BINARY, object for JSON, absent for NULL.
      required: [type]

    TopicList:
      type: object
      properties:
        topics:
          type: array
          items:
            type: string
      required: [topics]

    TopicMetadata:
      type: object
      properties:
        topic:
          type: string
        partitions:
          type: array
          items:
            type: object
            properties:
              partition:
                type: integer
              leader:
                type: object
                properties:
                  brokerId:
                    type: integer
                  host:
                    type: string
                  port:
                    type: integer
              replicas:
                type: array
                items:
                  type: integer
              isr:
                type: array
                items:
                  type: integer
      required: [topic, partitions]

    ProduceRequest:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/ProduceRecord"
          minItems: 1
        acks:
          type: string
          enum: [all, leader, none]
          default: all
        timeoutMs:
          type: integer
          default: 30000
          minimum: 1
      required: [records]

    ProduceRecord:
      type: object
      properties:
        partition:
          type: integer
          minimum: 0
        key:
          $ref: "#/components/schemas/DataObject"
        value:
          $ref: "#/components/schemas/DataObject"
        headers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
            required: [name, value]

    ProduceResponse:
      type: object
      properties:
        offsets:
          type: array
          items:
            type: object
            properties:
              partition:
                type: integer
              offset:
                type: integer
                format: int64
              errorCode:
                type: integer
              errorMessage:
                type: string
      required: [offsets]

    FetchRequest:
      type: object
      properties:
        partitions:
          type: array
          items:
            type: object
            properties:
              partition:
                type: integer
              offset:
                type: integer
                format: int64
            required: [partition, offset]
          minItems: 1
        maxWaitMs:
          type: integer
          default: 500
        minBytes:
          type: integer
          default: 1
        maxBytes:
          type: integer
          default: 10485760
        maxBytesPerPartition:
          type: integer
          default: 1048576
        isolationLevel:
          type: string
          enum: [READ_COMMITTED, READ_UNCOMMITTED]
          default: READ_UNCOMMITTED
      required: [partitions]

    FetchResponse:
      type: object
      properties:
        partitions:
          type: array
          items:
            type: object
            properties:
              partition:
                type: integer
              highWatermark:
                type: integer
                format: int64
              records:
                type: array
                items:
                  type: object
                  properties:
                    offset:
                      type: integer
                      format: int64
                    timestamp:
                      type: integer
                      format: int64
                    key:
                      $ref: "#/components/schemas/DataObject"
                    value:
                      $ref: "#/components/schemas/DataObject"
                    headers:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          value:
                            type: string
              errorCode:
                type: integer
              errorMessage:
                type: string
      required: [partitions]

    OffsetInfo:
      type: object
      properties:
        partition:
          type: integer
        offset:
          type: integer
          format: int64
        timestamp:
          type: integer
          format: int64
      required: [partition, offset, timestamp]

    ConsumerGroupLag:
      type: object
      properties:
        group:
          type: string
        totalLag:
          type: integer
          format: int64
        partitions:
          type: array
          items:
            type: object
            properties:
              topic:
                type: string
              partition:
                type: integer
              committedOffset:
                type: integer
                format: int64
              logEndOffset:
                type: integer
                format: int64
              lag:
                type: integer
                format: int64
      required: [group, totalLag, partitions]

    OffsetCommitRequest:
      type: object
      properties:
        offsets:
          type: array
          items:
            type: object
            properties:
              topic:
                type: string
              partition:
                type: integer
              offset:
                type: integer
                format: int64
              metadata:
                type: string
                default: ""
            required: [topic, partition, offset]
      required: [offsets]

    OffsetCommitResponse:
      type: object
      properties:
        offsets:
          type: array
          items:
            type: object
            properties:
              topic:
                type: string
              partition:
                type: integer
              offset:
                type: integer
                format: int64
              errorCode:
                type: integer

    OffsetFetchResponse:
      type: object
      properties:
        group:
          type: string
        offsets:
          type: array
          items:
            type: object
            properties:
              topic:
                type: string
              partition:
                type: integer
              offset:
                type: integer
                format: int64
              metadata:
                type: string

    ShareFetchRequest:
      type: object
      properties:
        topics:
          type: array
          items:
            type: string
        maxRecords:
          type: integer
          default: 100
        maxWaitMs:
          type: integer
          default: 5000
      required: [topics]

    ShareFetchResponse:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              topic:
                type: string
              partition:
                type: integer
              offset:
                type: integer
                format: int64
              key:
                $ref: "#/components/schemas/DataObject"
              value:
                $ref: "#/components/schemas/DataObject"
              acquireId:
                type: string

    ShareAcknowledgeRequest:
      type: object
      properties:
        acknowledgements:
          type: array
          items:
            type: object
            properties:
              acquireId:
                type: string
              type:
                type: string
                enum: [ACCEPT, REJECT, RELEASE]
            required: [acquireId, type]
      required: [acknowledgements]

    ShareAcknowledgeResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              acquireId:
                type: string
              errorCode:
                type: integer
              errorMessage:
                type: string
